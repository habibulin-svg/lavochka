# ГОПС, партия 13: полный набор музыки на YuE2 без адаптера (решение пользователя 2026-11-01:
# «отличные треки», адаптер не нужен; по несколько вариантов на ситуацию, чтобы не надоедало).
# Ночной прогон. Порядок — по важности: если к утру не дойдёт до конца, главное уже есть.
# menu и battle — те же промпты, что в партии 12 (сиды 11, 22 оттуда скопированы, не пересчитываются).
out: G:/temp/studio/out/gops/13-yue2-full
max_duration: 130
tracks:
  - name: menu
    seeds: [11, 22, 33, 44]
    style: >-
      eurodance, 1990s, instrumental, 136 bpm, euphoric, catchy supersaw lead melody, house piano chords,
      driving octave bass, punchy kick, claps, rave stabs, big build-up, polished radio mix
    lyrics: "[intro]\n[verse]\n[chorus]\n[interlude]\n[chorus]\n[outro]"

  - name: menu-b
    seeds: [11, 22]
    style: >-
      eurodance, 1990s, instrumental, 134 bpm, uplifting, bright piano riff, warm string pads, bouncy octave bass,
      four on the floor kick, claps, catchy synth hook, feel-good summer radio mix
    lyrics: "[intro]\n[verse]\n[chorus]\n[interlude]\n[chorus]\n[outro]"

  - name: battle
    seeds: [11, 22, 33, 44]
    style: >-
      eurodance, 1990s, instrumental, 136 bpm, energetic, hard kick, offbeat bass, hoover synth lead,
      rave stabs, snare rolls, arcade fighting game energy, loud club mix
    lyrics: "[intro]\n[chorus]\n[verse]\n[chorus]\n[bridge]\n[chorus]"

  - name: battle-b
    seeds: [11, 22, 33]
    style: >-
      eurodance, 1990s, instrumental, 138 bpm, driving, punchy four on the floor kick, rolling offbeat bass,
