# Коммерсы 2.0: звуки второго сезона (клуб, крах, «Цифра», болезнь, остров). По 2 варианта, в игру — оба (случайный).
# G:/ai/venvs/3d/Scripts/python.exe studio/runners/sfx.py studio/jobs/kommersy2/28-sfx.yaml
# Упаковка: studio/post/pack_kommersy2.py → lavochka/public/kommersy/a/sfx/<имя>-<сид>.ogg
out: G:/temp/studio/out/kommersy2/28-sfx
seeds: [1, 2]
sounds:
  # клуб
  - {name: s2-tribuna, duration: 4, level: normal, max: 3.5, prompt: "football stadium crowd ambience, thousands of fans singing a chant, distant drums"}
  - {name: s2-whistle, duration: 2, level: normal, max: 1.2, prompt: "football referee whistle, one long blow in a big stadium"}
  - {name: s2-goal, duration: 4, level: loud, max: 3.5, prompt: "huge stadium crowd erupting in a roar after a goal, cheering and clapping"}
  - {name: s2-net, duration: 1, level: normal, max: 0.8, prompt: "football ball hitting the goal net hard, swish and rope rattle, close up"}
  - {name: s2-groan, duration: 3, level: normal, max: 2.5, prompt: "stadium crowd groaning in disappointment after a missed chance, then whistles"}
  - {name: s2-locker, duration: 2, level: normal, max: 1.5, prompt: "metal locker door slammed in an echoing changing room, football studs on tiles"}
  - {name: s2-transfer, duration: 2, level: normal, max: 1.2, prompt: "old mobile flip phone ringing with a polyphonic ringtone, short"}
  # крах
  - {name: s2-crash, duration: 3, level: normal, max: 2.5, prompt: "stock exchange trading floor in panic, many phones ringing, traders shouting, chaos"}
  - {name: s2-hammer, duration: 2, level: normal, max: 1.2, prompt: "auction gavel striking a wooden block twice in a quiet hall"}
  # «Цифра»
  - {name: s2-keyboard, duration: 2, level: quiet, max: 1.5, prompt: "fast typing on a laptop keyboard in a quiet office, close up"}
  - {name: s2-notify, duration: 1, level: ui, max: 0.6, prompt: "short bright smartphone notification ping, clean digital chime"}
  - {name: s2-crypto, duration: 2, level: normal, max: 1.2, prompt: "shimmering digital coin chime with a sparkling synth rise, short game reward sound"}
  - {name: s2-launch, duration: 3, level: normal, max: 2.5, prompt: "small office party, champagne cork pop, people cheering and clapping"}
  # здоровье и финалы
  - {name: s2-heart, duration: 3, level: quiet, max: 2.5, prompt: "hospital heart monitor steady beeping in an intensive care room, ventilator breathing"}
  - {name: s2-waves, duration: 4, level: quiet, max: 3.5, prompt: "gentle tropical sea waves on a sandy beach, calm"}
  - {name: s2-gulls, duration: 3, level: quiet, max: 2.5, prompt: "seagulls calling over a quiet harbor with soft waves"}
