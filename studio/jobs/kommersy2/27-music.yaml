# Коммерсы 2.0: музыка второго сезона (2004–2021), 8 песен с вокалом, русский текст — оригинальный, шуточный и лирический.
# Формат и тон — как в studio/jobs/kommersy/06-music.yaml (YuE2 по-русски проверен в первом сезоне).
# Лицензия — как в docstring studio/runners/yue2.py (CC BY-NC 4.0 + разрешение YuE2 для индивидуальных авторов).
out: G:/temp/studio/out/kommersy2/27-music
max_duration: 150
tracks:
  - name: s2-london          # «Лондон 2004»
    seeds: [11, 22]
    silence_vocal: false
    style: >-
      russian vocals, britpop, 2004, 124 bpm, jangly electric guitars, acoustic guitar strum, live drums,
      bass guitar, hopeful, singalong chorus, male vocalist, warm tenor, major key
    lyrics: |
      [intro]
      [verse]
      Чемодан и старый плащ
      Дождик, лужи, мой чужой Лондон
      Я сошёл на перрон,
      Всё не так, как в кино
      Говорят мне: «Йес, май френд»
      Я киваю: «Да, привет»
      Мне б на поле выйти в семь,
      А пока я просто тень
      [chorus]
      Лондон, Лондон, две тыщи четвёртый
      Я пришёл, и я не твёрдый
      Лондон, Лондон, дай мне шанс
      Я не подведу и вас
      [verse]
      В раздевалке тишина,
      Чай с молоком у окна
      Тренер хлопнул по плечу,
      Я сказал: «Я всё хочу»
      Из Затулинки пацан
      Вышел в свет, как в первый раз
      Мама шлёт мне в смс
      «Надень шапку, там же лес»
      [chorus]
      Лондон, Лондон, две тыщи четвёртый
      Я пришёл, и я не твёрдый
      Лондон, Лондон, дай мне шанс
      Я не подведу и вас
      [outro]

  - name: s2-stadion         # «Стадион»
    seeds: [11, 22]
    silence_vocal: false
    style: >-
      russian vocals, stadium rock anthem, 2000s, 118 bpm, stomp and clap rhythm, big distorted guitars,
      crowd chants, choir of fans, powerful drums, epic, male vocalist, strong raspy tenor, major key
    lyrics: |
      [intro]
      [verse]
      Гудит трибуна, как прибой,
      Сто тысяч глаз глядят на нас
      Свисток, и мяч летит стрелой,
      И сердце бьёт в урочный час
      Шарфы вверх и флаги в ряд,
      Все мы вместе, все мы рядом
      Кто-то плачет, кто-то рад,
      Но поёт стена за стадом
      [chorus]
      Эй, стадион, стадион,
      Мы с тобой в один закон
      Эй, стадион, стадион,
      Громче, громче, в унисон
      [verse]
      Пусть мороз и пусть дожди,
      Мы стоим на всех ветрах
      Ты на поле выходи,
      Мы не дрогнем, мы в рядах
      Если пропустили гол,
      Не печалься, дорогой
      Вся толпа с тобой поёт,
      Что к победе мы идём
      [chorus]
      Эй, стадион, стадион,
      Мы с тобой в один закон
      Эй, стадион, стадион,
      Громче, громче, в унисон
      [outro]

  - name: s2-krah            # «Крах»
    seeds: [11, 22]
    silence_vocal: false
    style: >-
      russian vocals, dark indie rock, post-punk, 2008, 112 bpm, angular clean guitar, driving bass,
      cold reverb, tight drums, brooding, minor key, male vocalist, low baritone, restrained
    lyrics: |
      [intro]
      [verse]
      Цифры падают в окне,
      Красным светятся во тьме
      Я смотрю на монитор,
      А в нём тихий приговор
      Телефон молчит вокруг,
      Выпал кофе из рук
      Всё, что строил я года,
      Просто утекло, как вода
      [chorus]
      Крах, крах, тишина
      Кончилась игра сполна
      Крах, крах, свет погас
      Только эхо рядом с нами
      [verse]
      Друг сказал: «Держись, браток»
      И исчез за поворот
      Остаётся мой диван
      И в углу пустой стакан
      Я считаю до утра,
      Сколько было и ушло
      Но на кухне свет горит,
      И рассвет не за горами
      [chorus]
      Крах, крах, тишина
      Кончилась игра сполна
      Крах, крах, свет погас
      Только эхо рядом с нами
      [outro]

  - name: s2-taiga           # «Силиконовая тайга»
    seeds: [11, 22]
    silence_vocal: false
    style: >-
      russian vocals, synth-pop, electronic, 2010, 120 bpm, pulsing analog synth bass, glittering arpeggios,
      electronic drums, warm pads, dreamy, minor key, male vocalist, light tenor, slightly robotic
    lyrics: |
      [intro]
      [verse]
      В Академгородке в гараже
      Мы сидим с ноутбуком в душе
      За окном белый снег и сосна,
      А в строке бежит ночь допоздна
      Кофе, паяльник и свет,
      Я пишу тебе первый ответ
      Нолик, единица, ещё раз,
      Мы запустим мир в этот час
      [chorus]
      Силиконовая тайга,
      Кодом светят берега
      Силиконовая тайга,
      Нам не страшна пурга
      [verse]
      Сервер гудит, как медведь,
      Нас не нужно жалеть
      Строки падают в ряд,
      Как снежинки в аккурат
      Из гаража выйдем мы
      В самый центр большой зимы
      Прокатится по сети
      Наш привет из этой тьмы
      [chorus]
      Силиконовая тайга,
      Кодом светят берега
      Силиконовая тайга,
      Нам не страшна пурга
      [outro]

  - name: s2-hype            # «Хайп»
    seeds: [11, 22]
    silence_vocal: false
    style: >-
      russian vocals, pop, trap-pop, 2017, 140 bpm, 808 bass, rolling hi-hats, bright plucky synth lead,
      vocal chops, playful, ironic, catchy hook, male vocalist, autotuned, energetic
    lyrics: |
      [intro]
      [verse]
      У меня стартап в кармане,
      В нём идея на экране
      Я питчу по три раза,
      Нет ни денег, ни показа
      Слайды, графики, прогнозы,
      В них моржи, коты и розы
      Говорю: «Мы вырастем»
      Сам не знаю, куда именно
      [chorus]
      Хайп, хайп, хайп, хайп,
      Все лайкай, лайкай, лайкай
      Хайп, хайп, хайп, хайп,
      Только деньги не теряй
      [verse]
      Мой единорог из плюша
      Стоит дороже, чем игрушка
      Инвестор в пиджаке сказал:
      «Это круто, дайте шарик»
      Мы сидим на пуфиках,
      Пьём смузи из кактусов
      Через год я стану звездой
      Или вернусь к бабушке домой
      [chorus]
      Хайп, хайп, хайп, хайп,
      Все лайкай, лайкай, лайкай
      Хайп, хайп, хайп, хайп,
      Только деньги не теряй
      [outro]

  - name: s2-izolyaciya      # «Изоляция»
    seeds: [11, 22]
    silence_vocal: false
    style: >-
      russian vocals, lo-fi indie pop, 2020, 82 bpm, dusty drum loop, mellow electric piano, soft clean guitar,
      vinyl crackle, cozy, wistful, gentle, male vocalist, soft airy tenor, intimate
    lyrics: |
      [intro]
      [verse]
      Я сижу в своей квартире,
      Двадцать метров в целом мире
      Чай остыл, а чайник свистит,
      Тапок тихо в углу стоит
      Видеозвонок в десять тридцать,
      Все в квадратиках толпятся
      Ты кричишь: «Меня не слышно!»
      Я кричу: «Включи микрофон же!»
      [chorus]
      Я дома, дома, дома,
      Мир за окном как дальний кадр
      Я дома, дома, дома,
      Но мы вместе, даже так
      [verse]
      Кот прошёл по клавиатуре
      И отправил всем сюрприз
      Все смеются в тишине,
      Он доволен, как король
      Из окна кричит сосед:
      «Выходите на балкон!»
      Мы хлопаем в семь часов
      Всем, кто держит этот дом
      [chorus]
      Я дома, дома, дома,
      Мир за окном как дальний кадр
      Я дома, дома, дома,
      Но мы вместе, даже так
      [outro]

  - name: s2-reanimaciya     # «Реанимация»
    seeds: [11, 22]
    silence_vocal: false
    style: >-
      russian vocals, gentle piano ballad, 2021, 68 bpm, soft grand piano, light strings pad, minimal,
      tender, warm, hopeful, bright major key, female vocalist, soft clear voice, intimate
    lyrics: |
      [intro]
      [verse]
      Тихо светится окно,
      За стеклом идёт рассвет
      Всё, что было, всё равно
      Станет светом в тихом свете
      Ты послушай, я с тобой,
      Рядом дышит добрый день
      Пусть уходит прочь покой,
      Остаётся только тень
      [chorus]
      Вдох и выдох, вдох и выдох,
      Ты вернёшься, ты вернёшься
      Вдох и выдох, вдох и выдох,
      Солнце к нам опять прольётся
      [verse]
      Мы ещё с тобой споём
      Про двор и про весну
      Мы по лужам побредём,
      И я за руку возьму
      Пусть сегодня тишина,
      Завтра будет новый день
      Тихо тает тишина,
      Улыбается рассвет
      [chorus]
      Вдох и выдох, вдох и выдох,
      Ты вернёшься, ты вернёшься
      Вдох и выдох, вдох и выдох,
      Солнце к нам опять прольётся
      [outro]

  - name: s2-novaya-zatulinka  # «Нью-Затулинка»
    seeds: [11, 22]
    silence_vocal: false
    style: >-
      russian vocals, acoustic folk pop, 2021, 96 bpm, fingerpicked acoustic guitar, soft brushed drums,
      light bass, ocean waves ambience, seagulls, warm, nostalgic, heartfelt, male vocalist, warm baritone, singalong
    lyrics: |
      [intro]
      [verse]
      Здесь море плещет у крыльца,
      А пахнет двор, как в детстве
      Те же качели, те же лица,
      Только вместо льда — песок
      Ветер носит запах хлеба,
      Чайки кружат над столом
      И в закатном свете неба
      Мы сидим на лавочке вдвоём
      [chorus]
      Нью-Затулинка, Нью-Затулинка,
      Наш двор у синего моря
      Нью-Затулинка, Нью-Затулинка,
      Где дом, там и весна
      [verse]
      Вспомни, как мы тут играли,
      В классики и в города
      Как гитару мы таскали,
      Пели песни до утра
      Всё прошло, а всё осталось,
      Лавка, тополь и закат
      Кто-то снова улыбнулся
      Мы вернулись, мы дома
      [chorus]
      Нью-Затулинка, Нью-Затулинка,
      Наш двор у синего моря
      Нью-Затулинка, Нью-Затулинка,
      Где дом, там и весна
      [outro]
