# Герои, партия 3: эталон первого существа под 3D (этап 1 — одно существо насквозь: картинка → TripoSG → Blender → бой).
# Затонье, 2-я ступень: лягушатник-плевун (стрелок с духовой трубкой). Ракурс — как на поле боя: три четверти,
# лицом вправо, чуть сверху. Тот же ракурс потом у камеры Blender, и цвет переносится проекцией с этой картинки.
workflow: z_image_turbo
server: comfy-big
license: Apache-2.0 (Z-Image-Turbo)
defaults: {width: 1024, height: 1024, steps: 8}
seeds: [31, 32, 33, 34]
style: >-
  Stylized 3D game creature render, clean sculpted shapes, toon shading with a thin dark outline, soft studio light,
  bright but refined colors. Full body, whole figure in frame with margin, centered, plain light grey background.

items:
  - name: frog-34
    prompt: >-
      A frog-folk warrior from a misty fantasy swamp: upright stocky frog humanoid with mossy green skin and a pale belly,
      wide mouth, big golden eyes, wearing a woven reed vest and a small reed hat, holding a long bamboo blowpipe in both hands,
      standing in a three-quarter view facing right, seen slightly from above, legs apart, sturdy stance. {style}
  - name: frog-side
    prompt: >-
      A frog-folk warrior from a misty fantasy swamp: upright stocky frog humanoid with mossy green skin and a pale belly,
      wide mouth, big golden eyes, wearing a woven reed vest and a small reed hat, holding a long bamboo blowpipe in both hands,
      side view facing right, legs apart, sturdy stance. {style}
