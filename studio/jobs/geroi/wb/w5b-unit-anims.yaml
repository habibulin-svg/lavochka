    away, background objects
  frames: 49
items:
- name: militia-attack2
  image: w3-units-refine/militia-33.png
  prompt: 'Seen from the side: the militiaman steps forward to the right and thrusts his pitchfork horizontally to the right, side-on, arms extended, then pulls it back and stands as before. The pitchfork
    stays the same length and shape. The camera is completely static, locked off, the character stays in the same place in the centre of the frame; plain flat light grey background stays empty and unchanged;
    the 3D character render style stays exactly the same.'
- name: militia-hit
  image: w3-units-refine/militia-33.png
  prompt: 'The militiaman is struck: he flinches and staggers half a step backwards to the left, grimacing, then recovers to his standing pose. The camera is completely static, locked off, the character
    stays in the same place in the centre of the frame; plain flat light grey background stays empty and unchanged; the 3D character render style stays exactly the same.'
- name: militia-defend
  image: w3-units-refine/militia-33.png
  prompt: The militiaman braces himself, crouches slightly and holds the pitchfork shaft across his body with both hands like a barrier, then stays in this guard. The camera is completely static, locked
    off, the character stays in the same place in the centre of the frame; plain flat light grey background stays empty and unchanged; the 3D character render style stays exactly the same.
- name: militia-death
  image: w3-units-refine/militia-33.png
  prompt: 'The militiaman is defeated: he drops to his knees and slowly collapses onto his side on the ground and lies still; the pitchfork falls next to him. The camera is completely static, locked off,
