# Герои, переделки партии 11b-mounts после отбора
# Сгенерировано make_jobs.py — правки вносить туда.
workflow: z_image_turbo
server: comfy-big
license: Apache-2.0 (Z-Image-Turbo)
defaults:
  width: 1024
  height: 1024
  steps: 8
seeds:
- 63
- 64
style: Stylized 3D game creature render, clean sculpted shapes, toon shading with a thin dark outline, soft studio light, bright but refined colors. Full body, whole
  figure in frame with margin, standing in a three-quarter view facing right, seen slightly from above, centered, plain light grey background.
items:
- name: mount-akademiya-strazh
  prompt: A hero on horseback, a star guard knight in silver-blue armor, riding a horse with star academy mages, night blue, silver, deep green and warm gold tack
    and a small banner. {style}
- name: mount-akademiya-zvezdochet
  prompt: A hero on horseback, a stargazer mage with a silver beard or long silver hair and a star diadem, riding a horse with star academy mages, night blue, silver,
    deep green and warm gold tack and a small banner. {style}
