      cocky lopsided half-smile, Soviet army dress uniform with a white braided aiguillette, a small suitcase in hand,
      standing at the entrance of a grey nine-storey panel apartment block in Novosibirsk, birch trees, autumn. Full body.
      No text, no letters, no watermark.
