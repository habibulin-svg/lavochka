  lyrics: '[intro]

    [verse]

    Робот в клубе у окна

    Ждёт, когда придёт она

    Он блестит, как самовар

    И горит в нём тихий жар

    Он купил билет в кино

    Но в кино ему темно

    Он сказал ей: «Здравствуй, друг,

    У меня есть сто услуг»

    [chorus]

    Ах, любовь, любовь, любовь

    Закипает в нём любовь

    Он не знает слов других

    Только пищит: «Ты одна из них»

    [verse]

    Диско-шар крутил лучи

    Робот выбрал: «Научи,

    Как у вас там танцевать,

    Руки в стороны держать»

    Он сломал паркет в пыли

    Но девчонки не ушли

    Он сказал: «Прости, я груб,

    Я ещё немножко куб»

    [chorus]

    Ах, любовь, любовь, любовь

    Закипает в нём любовь

    Он не знает слов других

    Только пищит: «Ты одна из них»

    [outro]

    '
