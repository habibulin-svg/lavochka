# coturn — TURN для голоса и камеры (/api/ice). Ставится в /etc/turnserver.conf,
# секрет SECRET_HERE заменяется на тот же, что TURN_SECRET в /etc/lavochka.env.
# Логины временные (TURN REST API): сервер сайта выдаёт имя «срок:lavochka» и HMAC-SHA1 от секрета.
listening-ip=82.146.38.203
external-ip=82.146.38.203
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49999
realm=lavochka-games.ru
server-name=lavochka-games.ru
fingerprint
use-auth-secret
static-auth-secret=SECRET_HERE
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1
no-cli
no-multicast-peers
# ретранслировать только в интернет, не в локальные сети и не на сам сервер
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=82.146.38.203
user-quota=12
total-quota=300
max-bps=1000000
stale-nonce=600
log-file=syslog
simple-log
