# «Вечером на лавочке»: основной адрес — https://lavochka-games.ru, остальные домены и www — 301 на него
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

upstream lavochka_node { server 127.0.0.1:8787; keepalive 16; }

# Ограничение частоты по IP — от выкачивания сайта целиком и ботов-долбёжников.
# Пределы с запасом: за одним IP бывает целый мобильный оператор (CGNAT) или школа.
# Поисковики не ограничиваем, чтобы Яндекс и Google не получали 429 (User-Agent подделать можно — пусть, предел всё равно щадящий).
map $http_user_agent $lim_ip {
    ~*(YandexBot|YandexImages|YandexMobileBot|Googlebot|bingbot) "";
    default $binary_remote_addr;
}
# страницы — HTML (картинки, звуки и прочие файлы с точкой в адресе — отдельно)
map $uri $lim_page {
    ~^/(api|ws|assets)/ "";
    ~\.[a-z0-9]+$ "";
    default $lim_ip;
}
map $uri $lim_file {
    ~^/(api|ws)/ "";
    ~\.[a-z0-9]+$ $lim_ip;
    default "";
}
limit_req_zone $lim_page zone=lv_page:10m rate=10r/s;
limit_req_zone $lim_file zone=lv_file:10m rate=60r/s;
limit_req_zone $lim_ip zone=lv_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=lv_ws:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    server_name lavochka-games.ru www.lavochka-games.ru lavochkagames.ru www.lavochkagames.ru lavochka-games.online www.lavochka-games.online;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://lavochka-games.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.lavochka-games.ru lavochkagames.ru www.lavochkagames.ru lavochka-games.online www.lavochka-games.online;
    ssl_certificate     /etc/letsencrypt/live/lavochka/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lavochka/privkey.pem;
    return 301 https://lavochka-games.ru$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name lavochka-games.ru;
    ssl_certificate     /etc/letsencrypt/live/lavochka/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lavochka/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml text/xml;

    client_max_body_size 64k;

    # хэшированные файлы сборки — прямо с диска
    location /assets/ {
        limit_req zone=lv_file burst=400 nodelay;
        root /srv/lavochka/app/lavochka/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # письма от Postfix (deploy/mail/) — только изнутри сервера, мимо nginx
    location = /api/mail/in { return 404; }

    location /ws {
        limit_conn lv_ws 30;
        proxy_pass http://lavochka_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # админка: картинки к записям (до 5 МБ) и сами записи (длинные статьи) — больше общего предела
    location ~ ^/api/admin/(upload|posts)$ {
        client_max_body_size 6m;
        limit_req zone=lv_api burst=100 nodelay;
        proxy_pass http://lavochka_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — свой предел; /api/mail/in и админка выше
    location /api/ {
        limit_req zone=lv_api burst=100 nodelay;
        proxy_pass http://lavochka_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # страницы и файлы из public/ (превью, звуки, поля): на главной сразу ~90 картинок — отсюда большой запас у файлов
    location / {
        limit_req zone=lv_page burst=60 nodelay;
        limit_req zone=lv_file burst=400 nodelay;
        proxy_pass http://lavochka_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
