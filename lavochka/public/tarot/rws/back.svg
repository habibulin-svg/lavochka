<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1200">
  <!-- Рубашка таро «Розы и лилии» (по мотиву рубашки первого тиража 1909 года), нарисована для «Лавочки».
       Симметрична при повороте на 180°: по рубашке не видно, перевёрнута ли карта. -->
  <defs>
    <pattern id="lat" width="70" height="70" patternUnits="userSpaceOnUse" x="35" y="40">
      <rect width="70" height="70" fill="#5b1d2a"/>
      <path d="M35 0 L70 35 L35 70 L0 35 Z" fill="none" stroke="#c9a24a" stroke-width="2" opacity="0.75"/>
      <!-- роза в ромбе -->
      <g transform="translate(35 35)">
        <circle r="9.5" fill="#a8323f"/>
        <circle r="6" fill="#c8474f"/>
        <path d="M-3.5 -1.5 A4 4 0 1 1 3 2.5" fill="none" stroke="#5b1d2a" stroke-width="1.4"/>
        <circle r="1.6" fill="#e9c46a"/>
      </g>
      <!-- лилии в углах ромбов -->
      <g fill="#efe6cf" opacity="0.92">
        <path d="M0 -7 C3 -3 3 2 0 5 C-3 2 -3 -3 0 -7 Z"/>
        <path d="M70 -7 C73 -3 73 2 70 5 C67 2 67 -3 70 -7 Z"/>
        <path d="M0 63 C3 67 3 72 0 75 C-3 72 -3 67 0 63 Z"/>
        <path d="M70 63 C73 67 73 72 70 75 C67 72 67 67 70 63 Z"/>
      </g>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a2a38"/>
      <stop offset="1" stop-color="#5b1d2a"/>
    </radialGradient>
    <clipPath id="field"><rect x="44" y="44" width="612" height="1112" rx="10"/></clipPath>
  </defs>

  <!-- картон с белым полем, как у лицевой стороны -->
  <rect width="700" height="1200" rx="28" fill="#f6f1e4"/>
  <rect x="26" y="26" width="648" height="1148" rx="14" fill="#2a1418"/>
  <rect x="34" y="34" width="632" height="1132" rx="12" fill="none" stroke="#c9a24a" stroke-width="4"/>
  <g clip-path="url(#field)">
    <rect x="44" y="44" width="612" height="1112" fill="url(#lat)"/>
  </g>
  <rect x="44" y="44" width="612" height="1112" rx="10" fill="none" stroke="#c9a24a" stroke-width="2"/>

  <!-- середина: солнце и две луны (верх-низ одинаковы) -->
  <g transform="translate(350 600)">
    <ellipse rx="190" ry="250" fill="url(#glow)" stroke="#c9a24a" stroke-width="5"/>
    <ellipse rx="174" ry="234" fill="none" stroke="#c9a24a" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/>
    <g fill="#e2bb5c">
      <!-- лучи -->
      <g id="rays">
        <path d="M0 -118 L9 -78 L-9 -78 Z"/>
        <path d="M0 -118 L9 -78 L-9 -78 Z" transform="rotate(30)"/>
        <path d="M0 -118 L9 -78 L-9 -78 Z" transform="rotate(60)"/>
        <path d="M0 -118 L9 -78 L-9 -78 Z" transform="rotate(90)"/>
        <path d="M0 -118 L9 -78 L-9 -78 Z" transform="rotate(120)"/>
        <path d="M0 -118 L9 -78 L-9 -78 Z" transform="rotate(150)"/>
      </g>
      <use href="#rays" transform="rotate(180)"/>
      <g opacity="0.6">
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(15)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(45)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(75)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(105)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(135)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(165)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(195)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(225)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(255)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(285)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(315)"/>
        <path d="M0 -100 L5 -78 L-5 -78 Z" transform="rotate(345)"/>
      </g>
    </g>
    <circle r="70" fill="#e9c46a" stroke="#8a6420" stroke-width="3"/>
    <circle r="56" fill="none" stroke="#8a6420" stroke-width="1.5"/>
    <!-- звезда-восьмилучёвка в солнце -->
    <path d="M0 -44 L10 -10 L44 0 L10 10 L0 44 L-10 10 L-44 0 L-10 -10 Z" fill="#5b1d2a"/>
    <circle r="7" fill="#e9c46a"/>
    <!-- луны сверху и снизу -->
    <g id="moon" transform="translate(0 -176)">
      <circle r="30" fill="#efe6cf"/>
      <circle cx="11" cy="-6" r="26" fill="#7a2a38"/>
    </g>
    <use href="#moon" transform="rotate(180)"/>
    <!-- звёздочки по бокам -->
    <g id="star" fill="#efe6cf" transform="translate(-128 0)">
      <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z"/>
    </g>
    <use href="#star" transform="rotate(180)"/>
  </g>

  <!-- уголки-лилии в каждом углу поля -->
  <g id="corner" fill="none" stroke="#c9a24a" stroke-width="3">
    <path d="M58 140 L58 58 L140 58"/>
    <path d="M70 110 Q70 70 110 70" stroke-width="2"/>
    <circle cx="80" cy="80" r="7" fill="#c9a24a" stroke="none"/>
  </g>
  <use href="#corner" transform="rotate(180 350 600)"/>
  <use href="#corner" transform="translate(700 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(0 1200) scale(1 -1)"/>
</svg>
