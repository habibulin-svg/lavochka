# Render.com: New → Blueprint → этот репозиторий (сборник лежит в папке lavochka). Бесплатный тариф засыпает после 15 минут простоя.
services:
  - type: web
    name: vecherom-na-lavochke
    runtime: node
    plan: free
    rootDir: lavochka
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # TURN для голосового чата (Cloudflare → Realtime → TURN Server): без него за строгим NAT голос и камера не соединяются
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
