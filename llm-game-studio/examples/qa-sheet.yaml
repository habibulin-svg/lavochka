lgs: 1
name: qa-sheet
title: "VLM-отбор: модель со зрением отбраковывает картинки, человек смотрит спорное"
description: "Первый проход по выходу генерации делает локальная VLM (годно/брак + причина), человек утверждает."
project: demo
vars:
  source: "G:/temp/lgs/out/demo/kiosk/art"     # папка с картинками (выход другого запуска)
steps:
  - id: judge
    title: Оценка картинок
    uses: vlm
    inputs: "${source}/*.png"
    json: true
    think: false
    max_tokens: 300
    system: "Ты арт-директор игры в стиле плоского мультфильма. Отвечаешь только JSON."
    prompt: >
      Оцени картинку как игровой ассет: один предмет, белый фон, без надписей и логотипов, читается на тёмном и светлом.
      Верни {"ok": true/false, "score": 1-10, "reason": "коротко по-русски"}.

  - id: pick
    title: Утвердить
    uses: approve
    show: [judge]
    message: "Оценки модели — под картинками. Отметьте, что берём."
